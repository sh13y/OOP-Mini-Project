name: Release Qt Application

on:
  push:
    tags:
      - 'v*' # Trigger on version tags

env:
  QT_VERSION: '6.8.2'
  MINGW_VERSION: '11.2.0'
  BUILD_TYPE: Release

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Cache Qt
      id: cache-qt
      uses: actions/cache@v3
      with:
        path: ${{ runner.workspace }}/Qt
        key: ${{ runner.os }}-qt-${{ env.QT_VERSION }}
    
    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: ${{ env.QT_VERSION }}
        host: 'windows'
        target: 'desktop'
        arch: 'win64_mingw'
        tools: 'tools_mingw,qt.tools.win64_mingw'
        cache: true
    
    - name: Set up MinGW
      uses: egor-tensin/setup-mingw@v2
      with:
        version: ${{ env.MINGW_VERSION }}
        platform: x64
    
    - name: Create Build Directory
      run: mkdir build
    
    - name: Configure and Build
      working-directory: build
      run: |
        qmake ../PersonalOrganizer.pro CONFIG+=release
        mingw32-make -j4
    
    - name: Deploy Qt Dependencies
      working-directory: build/release
      run: |
        windeployqt --release --no-translations --no-system-d3d-compiler PersonalOrganizer.exe
    
    - name: Create ZIP Archive
      working-directory: build/release
      run: |
        7z a ../../PersonalOrganizer-Windows.zip *
    
    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: PersonalOrganizer-Windows.zip
        name: Release ${{ github.ref_name }}
        body: |
          Personal Organizer Release ${{ github.ref_name }}
          
          ### What's New
          - Automated release build
          - Windows x64 build included
          
          ### Installation
          1. Download the ZIP file
          2. Extract to your preferred location
          3. Run PersonalOrganizer.exe
          
          ### System Requirements
          - Windows 10 or later (64-bit)
          - No additional installation required (portable)